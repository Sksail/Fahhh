<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Trigger Demo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">
  <style>
    body {
      background: #181820;
      color: #fafafa;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .container {
      background: #232336;
      border-radius: 16px;
      padding: 48px 32px 36px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn {
      background: #262648;
      color: #fafafa;
      font-size: 2rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 24px 60px;
      margin-top: 16px;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 10px rgba(30,30,80,.2);
    }
    .btn:active, .btn:focus {
      background: #32327a;
      outline: none;
    }
    .status {
      margin-top: 36px;
      font-size: 1.6rem;
      text-align: center;
      color: #44f688;
      min-height: 2em;
      letter-spacing: .04em;
      font-weight: 500;
    }
    @media only screen and (max-width:480px) {
      .container { padding: 24px 12px 24px 12px; }
      .btn { font-size: 1.3rem; padding: 14px 24px; }
      .status { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Voice Trigger Demo</h1>
    <button id="start-btn" class="btn">Start Listening</button>
    <div id="status" class="status"></div>
    <audio id="trigger-audio" src="sound.mp3" preload="auto"></audio>
  </div>
  <script src="script.js"></script>
</body>
</html>
